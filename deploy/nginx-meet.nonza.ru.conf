# HTTPS фронт meet.nonza.ru (standalone PWA + WebRTC).
# Сертификаты: certbot / Let's Encrypt (wildcard nonza.ru или отдельный meet.nonza.ru).
#
#   sudo certbot certonly --nginx -d meet.nonza.ru
#   # или общий: /etc/letsencrypt/live/nonza.ru/
#
#   sudo cp deploy/nginx-meet.nonza.ru.conf /etc/nginx/sites-available/meet.nonza.ru.conf
#   sudo ln -s /etc/nginx/sites-available/meet.nonza.ru.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name meet.nonza.ru;

    ssl_certificate     /etc/letsencrypt/live/nonza.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nonza.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Если фронт в Docker на хосте — проксируй на контейнер; иначе root на статику.
    # Вариант A: reverse proxy на контейнер meet
    # location / { proxy_pass http://127.0.0.1:3080; ... }
    #
    # Вариант B: статика с диска (после docker cp / rsync dist)
    root /var/www/meet.nonza.ru;
    index index.html;

    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    # Политики для «Добавить на экран Домой» / PWA + камера/мик
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), autoplay=(self), fullscreen=(self), geolocation=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), autoplay=(self), fullscreen=(self), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), autoplay=(self), fullscreen=(self), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location ~* \.(js|mjs)$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name meet.nonza.ru;
    return 301 https://$host$request_uri;
}
