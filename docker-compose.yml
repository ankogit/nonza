services:
  postgres:
    image: postgres:15-alpine
    container_name: nonza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nonza
      POSTGRES_PASSWORD: nonza_password
      POSTGRES_DB: nonza
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nonza"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 1500m
    mem_reservation: 900m
    cpus: "0.60"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nonza-network

  redis:
    image: redis:7-alpine
    container_name: nonza-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "0.25"
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nonza-network

  livekit:
    image: livekit/livekit-server:latest
    container_name: nonza-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50100:50000-50100/udp"
      - "3479:3479/udp"
    volumes:
      - ./deploy/livekit-config.yaml:/etc/livekit.yaml
    depends_on:
      redis:
        condition: service_healthy
    command: --config /etc/livekit.yaml
    mem_limit: 1000m
    mem_reservation: 512m
    cpus: "0.70"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nonza-network

  # core (закомментировано)
  # coturn:
  #   image: coturn/coturn:latest
  #   container_name: nonza-coturn
  #   ports:
  #     - "5349:5349"
  #     - "3478:3478/udp"
  #     - "3478:3478"
  #     - "49152-49200:49152-49200/udp"
  #   volumes:
  #     - ./deploy/coturn.conf:/etc/coturn/turnserver.conf
  #     - ./deploy/coturn-entrypoint.sh:/entrypoint.sh
  #     - ./deploy/keys:/etc/coturn/certs:ro
  #   env_file:
  #     - ./backend/.env
  #   command: ["sh", "/entrypoint.sh"]
  #   networks:
  #     - nonza-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nonza-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - nonza-network
    restart: unless-stopped
    mem_limit: 1200m
    mem_reservation: 700m
    cpus: "0.85"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend-rooms:
    build:
      context: ./apps/meet
      dockerfile: Dockerfile
      args:
        VITE_APP: rooms
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL:-ws://localhost:7880}
    container_name: nonza-frontend-rooms
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - nonza-network
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.20"
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend-meets:
    build:
      context: ./apps/meet
      dockerfile: Dockerfile
      args:
        VITE_APP: meets
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL:-ws://localhost:7880}
    container_name: nonza-frontend-meets
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - nonza-network
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.20"
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:

networks:
  nonza-network:
    driver: bridge
