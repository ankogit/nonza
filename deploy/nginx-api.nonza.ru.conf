server {
    listen 443 ssl;
    server_name api.nonza.ru;

    ssl_certificate /etc/letsencrypt/live/nonza.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nonza.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

server {
    listen 80;
    server_name api.nonza.ru;
    if ($host = api.nonza.ru) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
